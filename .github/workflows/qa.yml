name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system build dependencies
        # gaiaoffline pins lxml<6; lxml 5.x ships no wheels for Python 3.14+,
        # so it must be compiled from source against libxml2/libxslt.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies (poetry)
        env:
          # lxml 5.x's C sources trip GCC 14+'s incompatible-pointer-types
          # error against libxml2 >= 2.14 (const-only mismatch; harmless).
          CFLAGS: -Wno-error=incompatible-pointer-types
        run: |
          poetry config virtualenvs.create false --local
          poetry install --no-interaction --with dev

      - name: Ensure CLI tools available
        run: |
          python -m pip install --upgrade pip
          # Install ruff and mkdocs toolchain (some tools are not in pyproject dev group)
          pip install ruff mkdocs mkdocs-material mkdocs-jupyter mkdocstrings mkdocs-include-markdown-plugin

      - name: Lint with ruff
        run: ruff check src tests

      - name: Lint with flake8
        run: flake8 src tests

      - name: Run tests
        run: pytest -q

      - name: Build docs
        run: |
          # Build documentation to verify docs build doesn't fail
          mkdocs build --strict
